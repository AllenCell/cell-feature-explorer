name: Promote to production AWS
env:
    NODE_VERSION: "22"
on:
    push:
        # Sequence of patterns matched against refs/tags
        tags:
            - "v*" # Push events to matching v*, i.e. v1.0, v20.15.10

permissions: {}

jobs:
    deploy:
        name: Upload to Amazon S3
        runs-on: ubuntu-latest
        permissions:
            id-token: write  # Required for requesting the JWT and OIDC
            contents: read   # Required for actions/checkout

        steps:
            - uses: actions/checkout@v3
            - name: Configure AWS credentials
              uses: aws-actions/configure-aws-credentials@ec61189d14ec14c8efccab744f656cffd0e33f37  # v6.1.0
              with:
                  role-to-assume: arn:aws:iam::239877123246:role/github_cell_feature_explorer
                  aws-region: us-west-2

            - name: Copy files from staging bucket to production
              run: aws s3 sync s3://staging.cfe.allencell.org s3://production.cfe.allencell.org --delete
            - name: Clear cloudfront cache
              run: aws cloudfront create-invalidation --distribution-id E3S5ZMP0OVZ8R1 --paths "/*"
