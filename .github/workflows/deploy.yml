name: Deploy AWS
env:
    NODE_VERSION: "22"
on:
    push:
        # Sequence of patterns matched against refs/tags
        branches:
            - main

permissions:
    contents: read

jobs:
    lint:
        name: Lint
        runs-on: ubuntu-latest
        steps:
            - name: Checkout
              uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd #v6.0.2
              with:
                  persist-credentials: false
            - name: Setup Node
              uses: actions/setup-node@6044e13b5dc448c55e2357c09f80417699197238 #v6.2.0
              with:
                  node-version: ${{env.NODE_VERSION}}
                  cache: "npm"
                  cache-dependency-path: "package-lock.json"
            - run: npm ci
            - run: npm run lint --if-present
    test:
        name: Unit Test
        runs-on: ubuntu-latest
        steps:
            - name: Checkout
              uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd #v6.0.2
              with:
                  persist-credentials: false
            - name: Setup Node
              uses: actions/setup-node@6044e13b5dc448c55e2357c09f80417699197238 #v6.2.0
              with:
                  node-version: ${{env.NODE_VERSION}}
                  cache: "npm"
                  cache-dependency-path: "package-lock.json"
            - run: npm ci
            - run: npm test --if-present
    typeCheck:
        name: Type Check
        runs-on: ubuntu-latest
        steps:
            - name: Checkout
              uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd #v6.0.2
              with:
                  persist-credentials: false
            - name: Setup Node
              uses: actions/setup-node@6044e13b5dc448c55e2357c09f80417699197238 #v6.2.0
              with:
                  node-version: ${{env.NODE_VERSION}}
                  cache: "npm"
                  cache-dependency-path: "package-lock.json"
            - run: npm ci
            - run: npm run typeCheck --if-present

    deploy:
        needs: [lint, typeCheck, test]
        name: Upload to Amazon S3
        runs-on: ubuntu-latest
        permissions:
            id-token: write  # Required for requesting the JWT and OIDC
            contents: read   # Required for actions/checkout

        steps:
            - name: Checkout
              uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd #v6.0.2
              with:
                  persist-credentials: false
            - name: Configure AWS credentials
              uses: aws-actions/configure-aws-credentials@ec61189d14ec14c8efccab744f656cffd0e33f37 # v6.1.0
              with:
                  role-to-assume: arn:aws:iam::${{ vars.AWS_SOFTWARE_ACCOUNT_ID }}:role/github_cell_feature_explorer
                  aws-region: ${{ vars.AWS_DEFAULT_REGION }}
            - name: Setup Node
              uses: actions/setup-node@6044e13b5dc448c55e2357c09f80417699197238 #v6.2.0
              with:
                  node-version: ${{env.NODE_VERSION}}
                  registry-url: https://registry.npmjs.org/
                  package-manager-cache: false # Do not cache when publishing to prevent cache pollution attacks
            - run: npm ci
            - run: npm run build
            - name: Copy files to staging bucket
              run: aws s3 sync ./dist/ s3://staging.cfe.allencell.org --delete
