name: Manual Deploy Staging AWS
env:
    NODE_VERSION: "22"
on:
    workflow_dispatch:
        inputs:
            use_staging_db:
                description: "Deploy with staging db"
                required: true
                default: "false"

permissions:
    contents: read

jobs:
    lint:
        name: Lint
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v3
            - name: Setup Node
              uses: actions/setup-node@v3
              with:
                  node-version: ${{env.NODE_VERSION}}
            - run: npm ci
            - run: npm run lint --if-present
    test:
        name: Unit Test
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v3
            - name: Setup Node
              uses: actions/setup-node@v3
              with:
                  node-version: ${{env.NODE_VERSION}}
            - run: npm ci
            - run: npm test --if-present
    typeCheck:
        name: Type Check
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v3
            - name: Setup Node
              uses: actions/setup-node@v3
              with:
                  node-version: ${{env.NODE_VERSION}}
            - run: npm ci
            - run: npm run typeCheck --if-present

    deploy:
        needs: [lint, typeCheck, test]
        name: Upload to Amazon S3
        runs-on: ubuntu-latest
        permissions:
            id-token: write  # Required for requesting the JWT and OIDC
            contents: read   # Required for actions/checkout

        steps:
            - uses: actions/checkout@v3
            - name: Configure AWS credentials
              uses: aws-actions/configure-aws-credentials@ec61189d14ec14c8efccab744f656cffd0e33f37  # v6.1.0
              with:
                  role-to-assume: arn:aws:iam::239877123246:role/github_cell_feature_explorer
                  aws-region: us-west-2
            - name: Setup node
              uses: actions/setup-node@v3
              with:
                  node-version: ${{env.NODE_VERSION}}
            - run: npm ci
            - name: Staging Database
              if: ${{ github.event.inputs.use_staging_db == 'true' }}
              run: npm run staging-db-build
            - name: Production Database
              if: ${{ github.event.inputs.use_staging_db == 'false' }}
              run: npm run build
            - name: Copy files to staging bucket
              run: aws s3 sync ./dist/ s3://staging.cfe.allencell.org --delete
