# Adapted from https://github.com/marketplace/actions/deploy-pr-preview.
name: Deploy PR Preview

on:
    pull_request:
        types:
            - opened
            - reopened
            - synchronize
            - closed
concurrency: preview-${{ github.ref }}
permissions: {}

jobs:
    deploy-preview:
        runs-on: ubuntu-latest
        permissions:
            pull-requests: write # Required to comment on PR with preview link
            contents: write      # Required for pushing to gh-pages branch
        steps:
            - name: Checkout
              uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd #v6.0.2
              with:
                  persist-credentials: false

            - name: Setup Node
              uses: actions/setup-node@6044e13b5dc448c55e2357c09f80417699197238 #v6.2.0
              with:
                  node-version: "22"
                  cache: "npm"
                  cache-dependency-path: "package-lock.json"

              # Must override default vite build base so that assets can still be accessed
              # when not placed in the root directory of gh-pages branch.
            - name: Install dependencies
              run: npm ci

            - name: Build
              run: npx vite build --base=/${GITHUB_EVENT_REPOSITORY_NAME}/pr-preview/pr-${PR_NUMBER}/
              env:
                  GITHUB_EVENT_REPOSITORY_NAME: ${{ github.event.repository.name }}
                  PR_NUMBER: ${{ github.event.number }}

            - name: Deploy preview
              uses: rossjrw/pr-preview-action@8ff09e486b4c23709012eedd3b42e9f0b95dd0c5 #v1.6.3
              with:
                  source-dir: ./dist/
